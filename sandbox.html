<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generic Sandbox</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
#app{background:#111;min-height:620px;display:flex;flex-direction:column;font-family:'Georgia',serif;color:#ddd;padding:10px;gap:8px;}
#topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#title-text{font-size:16px;font-weight:500;color:#eee;letter-spacing:2px;margin-right:4px;}
.font-btn{padding:3px 8px;font-size:11px;border:1px solid #444;border-radius:4px;background:#1a1a1a;color:#aaa;cursor:pointer;}
.font-btn.active{border-color:#999;color:#fff;background:#2a2a2a;}
#bg-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#666;}
.bg-swatch{width:18px;height:18px;border-radius:3px;cursor:pointer;border:2px solid transparent;}
.bg-swatch.active{border-color:#fff;}
#palette{display:flex;flex-wrap:wrap;gap:4px;}
.el-btn{padding:3px 8px;font-size:11px;border:1.5px solid transparent;border-radius:4px;cursor:pointer;font-weight:500;color:#fff;transition:filter .1s;}
.el-btn:hover{filter:brightness(1.25);}
.el-btn.active{border-color:#fff;filter:brightness(1.3);}
#canvas-wrap{display:flex;justify-content:center;}
#canvas{border:2px solid #2a2a2a;border-radius:3px;cursor:crosshair;display:block;image-rendering:pixelated;max-width:100%;}
#bottombar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;color:#777;}
#bottombar label{display:flex;align-items:center;gap:5px;color:#999;}
#bottombar input[type=range]{accent-color:#777;}
.ctrl-group{display:flex;align-items:center;gap:5px;border:1px solid #2a2a2a;border-radius:4px;padding:3px 7px;}
.ctrl-label{font-size:10px;color:#555;margin-right:2px;}
#clear-btn{padding:3px 9px;font-size:11px;border:1px solid #333;border-radius:4px;background:#1a1a1a;color:#aaa;cursor:pointer;}
#clear-btn:hover{border-color:#777;color:#eee;}
#fps{font-size:10px;color:#444;margin-left:auto;}
#brush-val,#w-val,#h-val{font-size:11px;color:#bbb;min-width:20px;text-align:center;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="title-text">sandbox</span>
    <button class="font-btn active" data-font="Georgia,serif">Serif</button>
    <button class="font-btn" data-font="'Courier New',monospace">Mono</button>
    <button class="font-btn" data-font="Arial,sans-serif">Sans</button>
    <div id="bg-row"><span>bg:</span></div>
  </div>
  <div id="palette"></div>
  <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
  <div id="bottombar">
    <div class="ctrl-group">
      <span class="ctrl-label">Brush</span>
      <input type="range" id="brush" min="1" max="99" value="3" step="1" style="width:70px;">
      <span id="brush-val">3</span>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Width</span>
      <input type="range" id="w-slider" min="80" max="400" value="220" step="10" style="width:60px;">
      <span id="w-val">220</span>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Height</span>
      <input type="range" id="h-slider" min="60" max="280" value="160" step="10" style="width:60px;">
      <span id="h-val">160</span>
    </div>
    <div class="ctrl-group">
      <label><input type="checkbox" id="rain-cb"> Rain</label>
      <label style="margin-left:6px;"><input type="checkbox" id="wind-cb"> Wind</label>
    </div>
    <button id="clear-btn">Clear</button>
    <span id="fps">-- fps</span>
  </div>
</div>
<script>
const ELEMENTS=[
  {name:'Sand',    k:'SAND',   bg:'#b8941a',color:[215,180,90]},
  {name:'Water',   k:'WATER',  bg:'#1c6ab5',color:[55,130,215]},
  {name:'Dirt',    k:'DIRT',   bg:'#6b3e10',color:[125,78,35]},
  {name:'Stone',   k:'STONE',  bg:'#666',   color:[140,140,140]},
  {name:'Fire',    k:'FIRE',   bg:'#bb2200',color:[235,75,15]},
  {name:'Smoke',   k:'SMOKE',  bg:'#484848',color:[95,95,95]},
  {name:'Steam',   k:'STEAM',  bg:'#5f9cb5',color:[175,205,228]},
  {name:'Wood',    k:'WOOD',   bg:'#5a3208',color:[115,75,30]},
  {name:'Oil',     k:'OIL',    bg:'#3d2808',color:[70,50,20]},
  {name:'Lava',    k:'LAVA',   bg:'#aa3200',color:[210,70,8]},
  {name:'Ice',     k:'ICE',    bg:'#4a9fd4',color:[165,210,252]},
  {name:'Snow',    k:'SNOW',   bg:'#b8d8ee',color:[215,232,248]},
  {name:'Acid',    k:'ACID',   bg:'#3da800',color:[95,205,18]},
  {name:'Glass',   k:'GLASS',  bg:'#88bbbb',color:[185,218,218]},
  {name:'Gunpowder',k:'GUN',  bg:'#383838',color:[75,75,75]},
  {name:'Mud',     k:'MUD',    bg:'#4e3010',color:[95,60,25]},
  {name:'Plant',   k:'PLANT',  bg:'#1e6e18',color:[55,140,42]},
  {name:'Salt',    k:'SALT',   bg:'#c8c8c8',color:[225,225,225]},
  {name:'Tornado', k:'TORNADO',bg:'#6644aa',color:[155,125,198]},
  {name:'Virus',   k:'VIRUS',  bg:'#991a44',color:[195,45,95]},
  {name:'Cloud',   k:'CLOUD',  bg:'#7a8899',color:[195,205,218]},
  {name:'Lightning',k:'LIGHTNING',bg:'#cccc00',color:[255,255,80]},
  {name:'Honey',   k:'HONEY',  bg:'#cc7700',color:[220,145,20]},
  {name:'Wax',     k:'WAX',    bg:'#ddcc88',color:[228,210,150]},
  {name:'Obsidian',k:'OBSIDIAN',bg:'#220033',color:[45,10,60]},
  {name:'Bubble',  k:'BUBBLE', bg:'#44aacc',color:[150,210,235]},
  {name:'Magnet',  k:'MAGNET', bg:'#884400',color:[165,80,30]},
  {name:'Void',    k:'VOID',   bg:'#050505',color:[12,5,18]},
  {name:'Coral',   k:'CORAL',  bg:'#cc4433',color:[215,90,75]},
  {name:'Spore',   k:'SPORE',  bg:'#886600',color:[170,130,30]},
  {name:'Eraser',  k:'EMPTY',  bg:'#2a2a2a',color:null},
];

const SCALE=2;
let W=220,H=160;
const app=document.getElementById('app');
const canvas=document.getElementById('canvas');
canvas.width=W*SCALE; canvas.height=H*SCALE;
const ctx=canvas.getContext('2d');

const BG_COLORS=[
  {v:'#111',cv:[0,0,0]},{v:'#80ff00',cv:[0, 100,0]},
  {v:'#00ffff',cv:[0,0,100]},{v:'#9f00ff',cv:[50, 0, 50]},
];
let bgColor=BG_COLORS[0];

const bgRow=document.getElementById('bg-row');
BG_COLORS.forEach((c,i)=>{
  const sw=document.createElement('div');
  sw.className='bg-swatch'+(i===0?' active':'');
  sw.style.background=c.v;
  sw.onclick=()=>{bgColor=c;document.querySelectorAll('.bg-swatch').forEach(s=>s.classList.remove('active'));sw.classList.add('active');};
  bgRow.appendChild(sw);
});

document.querySelectorAll('.font-btn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.font-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    app.style.fontFamily=b.dataset.font;
  };
});

const palette=document.getElementById('palette');
let selected='SAND';
ELEMENTS.forEach(el=>{
  const btn=document.createElement('button');
  btn.className='el-btn'+(el.k===selected?' active':'');
  btn.textContent=el.name;
  btn.style.background=el.bg;
  btn.onclick=()=>{selected=el.k;document.querySelectorAll('.el-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');};
  palette.appendChild(btn);
});

const EMPTY=0,SAND=1,WATER=2,DIRT=3,STONE=4,FIRE=5,SMOKE=6,STEAM=7,WOOD=8,OIL=9,LAVA=10,ICE=11,SNOW=12,ACID=13,GLASS=14,GUN=15,MUD=16,PLANT=17,SALT=18,TORNADO=19,VIRUS=20,CLOUD=21,LIGHTNING=22,HONEY=23,WAX=24,OBSIDIAN=25,BUBBLE=26,MAGNET=27,VOID=28,CORAL=29,SPORE=30;
const KM={EMPTY,SAND,WATER,DIRT,STONE,FIRE,SMOKE,STEAM,WOOD,OIL,LAVA,ICE,SNOW,ACID,GLASS,GUN,MUD,PLANT,SALT,TORNADO,VIRUS,CLOUD,LIGHTNING,HONEY,WAX,OBSIDIAN,BUBBLE,MAGNET,VOID,CORAL,SPORE};
const COLS={
  [SAND]:[215,180,90],[WATER]:[55,130,215],[DIRT]:[125,78,35],[STONE]:[140,140,140],
  [FIRE]:[235,75,15],[SMOKE]:[95,95,95],[STEAM]:[175,205,228],[WOOD]:[115,75,30],
  [OIL]:[70,50,20],[LAVA]:[210,70,8],[ICE]:[165,210,252],[SNOW]:[215,232,248],
  [ACID]:[95,205,18],[GLASS]:[185,218,218],[GUN]:[75,75,75],[MUD]:[95,60,25],
  [PLANT]:[55,140,42],[SALT]:[225,225,225],[TORNADO]:[155,125,198],[VIRUS]:[195,45,95],
  [CLOUD]:[195,205,218],[LIGHTNING]:[255,255,80],[HONEY]:[220,145,20],[WAX]:[228,210,150],
  [OBSIDIAN]:[45,10,60],[BUBBLE]:[150,210,235],[MAGNET]:[165,80,30],[VOID]:[12,5,18],
  [CORAL]:[215,90,75],[SPORE]:[170,130,30]
};

let grid=new Uint8Array(W*H);
let life=new Uint16Array(W*H);
let upd=new Uint8Array(W*H);

const inB=(x,y)=>x>=0&&x<W&&y>=0&&y<H;
const ix=(x,y)=>y*W+x;
const get=(x,y)=>inB(x,y)?grid[ix(x,y)]:STONE;
const getL=(x,y)=>inB(x,y)?life[ix(x,y)]:0;
const set=(x,y,v,l=0)=>{if(inB(x,y)){grid[ix(x,y)]=v;life[ix(x,y)]=l;}};

function resizeGrid(nw,nh){
  const ng=new Uint8Array(nw*nh);
  const nl=new Uint16Array(nw*nh);
  const mw=Math.min(W,nw),mh=Math.min(H,nh);
  for(let y=0;y<mh;y++)for(let x=0;x<mw;x++){ng[y*nw+x]=grid[y*W+x];nl[y*nw+x]=life[y*W+x];}
  W=nw;H=nh;grid=ng;life=nl;upd=new Uint8Array(W*H);
  canvas.width=W*SCALE;canvas.height=H*SCALE;
  imgData=ctx.createImageData(W*SCALE,H*SCALE);
  pix=imgData.data;
}

let brushSize=3,rainOn=false,windOn=false,isDrawing=false;
document.getElementById('brush').oninput=e=>{brushSize=+e.target.value;document.getElementById('brush-val').textContent=brushSize;};
document.getElementById('w-slider').oninput=e=>{const v=+e.target.value;document.getElementById('w-val').textContent=v;resizeGrid(v,H);};
document.getElementById('h-slider').oninput=e=>{const v=+e.target.value;document.getElementById('h-val').textContent=v;resizeGrid(W,v);};
document.getElementById('rain-cb').onchange=e=>{rainOn=e.target.checked;};
document.getElementById('wind-cb').onchange=e=>{windOn=e.target.checked;};
document.getElementById('clear-btn').onclick=()=>{grid.fill(0);life.fill(0);};

function paint(cx,cy){
  const r=Math.max(0,brushSize-1);
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)
    if(dx*dx+dy*dy<=r*r+r&&inB(cx+dx,cy+dy))set(cx+dx,cy+dy,KM[selected]);
}
function cPos(e){
  const rect=canvas.getBoundingClientRect();
  const sx=W/rect.width,sy=H/rect.height;
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  return[Math.floor((cx-rect.left)*sx),Math.floor((cy-rect.top)*sy)];
}
canvas.onmousedown=e=>{isDrawing=true;paint(...cPos(e));};
canvas.onmousemove=e=>{if(isDrawing)paint(...cPos(e));};
canvas.onmouseup=canvas.onmouseleave=()=>{isDrawing=false;};
canvas.ontouchstart=e=>{e.preventDefault();isDrawing=true;paint(...cPos(e));};
canvas.ontouchmove=e=>{e.preventDefault();if(isDrawing)paint(...cPos(e));};
canvas.ontouchend=()=>{isDrawing=false;};

const rnd=()=>Math.random()<0.5?-1:1;
const RAIN_LIFE=120;

function step(){
  upd.fill(0);
  if(rainOn&&Math.random()<0.15){
    const rx=Math.floor(Math.random()*W);
    if(get(rx,0)===EMPTY)set(rx,0,WATER,RAIN_LIFE);
  }
  const leftFirst=Math.random()<0.5;
  for(let y=H-1;y>=0;y--){
    for(let xi=0;xi<W;xi++){
      const x=leftFirst?xi:W-1-xi;
      const i=ix(x,y);
      const c=grid[i];
      if(!c||upd[i])continue;
      upd[i]=1;
      let L=life[i];

      if(c===WATER){
        if(L>0){L--;life[i]=L;if(L===0){set(x,y,EMPTY);continue;}}
        const below=get(x,y+1);
        if(below===EMPTY||below===VOID){const lb=getL(x,y+1);set(x,y+1,WATER,L);set(x,y,below,lb);upd[ix(x,y+1)]=1;}
        else{
          const d=rnd();
          if(get(x+d,y+1)===EMPTY){set(x+d,y+1,WATER,L);set(x,y,EMPTY);upd[ix(x+d,y+1)]=1;}
          else if(get(x-d,y+1)===EMPTY){set(x-d,y+1,WATER,L);set(x,y,EMPTY);upd[ix(x-d,y+1)]=1;}
          else if(get(x+d,y)===EMPTY){set(x+d,y,WATER,L);set(x,y,EMPTY);upd[ix(x+d,y)]=1;}
          else if(get(x-d,y)===EMPTY){set(x-d,y,WATER,L);set(x,y,EMPTY);upd[ix(x-d,y)]=1;}
          else if(windOn&&get(x+1,y)===EMPTY){set(x+1,y,WATER,L);set(x,y,EMPTY);upd[ix(x+1,y)]=1;}
        }
        const adj=[[-1,0],[1,0],[0,1],[0,-1]];
        adj.forEach(([dx,dy])=>{
          const nc=get(x+dx,y+dy);
          if(nc===LAVA){set(x,y,STEAM);set(x+dx,y+dy,STONE);}
          if(nc===ACID){set(x,y,EMPTY);set(x+dx,y+dy,EMPTY);}
          if(nc===ICE&&Math.random()<0.001)set(x,y,ICE);
          if(nc===VOID)set(x,y,EMPTY);
          if(nc===MAGNET&&Math.random()<0.05)set(x,y,EMPTY);
        });
      } else if(c===SAND||c===DIRT||c===MUD||c===SNOW||c===SALT||c===GUN){
        const below=get(x,y+1);
        if(below===EMPTY||below===WATER||below===VOID){set(x,y+1,c);set(x,y,below);upd[ix(x,y+1)]=1;}
        else{const d=rnd();
          if(get(x+d,y+1)===EMPTY){set(x+d,y+1,c);set(x,y,EMPTY);upd[ix(x+d,y+1)]=1;}
          else if(get(x-d,y+1)===EMPTY){set(x-d,y+1,c);set(x,y,EMPTY);upd[ix(x-d,y+1)]=1;}
        }
        if(c===SAND&&(get(x,y+1)===WATER||get(x-1,y)===WATER||get(x+1,y)===WATER)&&Math.random()<0.001)set(x,y,MUD);
        if(c===SALT&&get(x,y+1)===WATER&&Math.random()<0.04){set(x,y,EMPTY);set(x,y+1,WATER);}
        if(c===SNOW&&(get(x,y+1)===FIRE||get(x-1,y)===FIRE||get(x+1,y)===FIRE||get(x,y-1)===FIRE)&&Math.random()<0.1)set(x,y,WATER);
        if(c===GUN&&(get(x,y+1)===FIRE||get(x-1,y)===FIRE||get(x+1,y)===FIRE)&&Math.random()<0.3)set(x,y,FIRE);
        if(c===DIRT&&get(x,y+1)===WATER&&Math.random()<0.002)set(x,y,MUD);
        if(get(x,y+1)===VOID||get(x-1,y)===VOID||get(x+1,y)===VOID)if(Math.random()<0.1)set(x,y,EMPTY);
        if(c===SAND&&(get(x,y+1)===MAGNET||get(x-1,y)===MAGNET||get(x+1,y)===MAGNET)&&Math.random()<0.08){
          if(get(x,y-1)===EMPTY){set(x,y-1,SAND);set(x,y,EMPTY);upd[ix(x,y-1)]=1;}
        }
      } else if(c===OIL||c===HONEY){
        const speed=c===HONEY?0.08:1;
        if(Math.random()<speed){
          const below2=get(x,y+1);
          if(below2===EMPTY||(c===OIL&&below2===WATER)){set(x,y+1,c);set(x,y,below2);upd[ix(x,y+1)]=1;}
          else{const d=rnd();
            if(get(x+d,y)===EMPTY){set(x+d,y,c);set(x,y,EMPTY);upd[ix(x+d,y)]=1;}
            else if(get(x-d,y)===EMPTY){set(x-d,y,c);set(x,y,EMPTY);upd[ix(x-d,y)]=1;}
          }
        }
        const adj=[[-1,0],[1,0],[0,-1],[0,1]];
        adj.forEach(([dx,dy])=>{if((get(x+dx,y+dy)===FIRE||get(x+dx,y+dy)===LAVA)&&Math.random()<0.05)set(x,y,FIRE);});
      } else if(c===FIRE){
        const adj=[[-1,0],[1,0],[0,-1],[0,1]];
        adj.forEach(([dx,dy])=>{
          const nc=get(x+dx,y+dy);
          if(nc===WOOD&&Math.random()<0.004)set(x+dx,y+dy,FIRE);
          if(nc===OIL&&Math.random()<0.06)set(x+dx,y+dy,FIRE);
          if(nc===PLANT&&Math.random()<0.05)set(x+dx,y+dy,FIRE);
          if(nc===GUN&&Math.random()<0.3)set(x+dx,y+dy,FIRE);
          if(nc===ICE&&Math.random()<0.05)set(x+dx,y+dy,WATER);
          if(nc===SNOW&&Math.random()<0.08)set(x+dx,y+dy,WATER);
          if(nc===SAND&&Math.random()<0.0006)set(x+dx,y+dy,GLASS);
          if(nc===VIRUS)set(x+dx,y+dy,EMPTY);
          if(nc===WAX&&Math.random()<0.01)set(x+dx,y+dy,OIL);
          if(nc===HONEY&&Math.random()<0.03)set(x+dx,y+dy,FIRE);
          if(nc===SPORE&&Math.random()<0.05)set(x+dx,y+dy,FIRE);
          if(nc===CORAL&&Math.random()<0.003)set(x+dx,y+dy,FIRE);
        });
        const r2=Math.random();
        if(r2<0.04)set(x,y,SMOKE);
        else if(r2<0.06)set(x,y,EMPTY);
        else if(get(x,y-1)===EMPTY&&Math.random()<0.15){set(x,y-1,FIRE);upd[ix(x,y-1)]=1;}
        else if(windOn&&get(x+1,y-1)===EMPTY&&Math.random()<0.3){set(x+1,y-1,FIRE);upd[ix(x+1,y-1)]=1;}
      } else if(c===SMOKE||c===STEAM||c===BUBBLE){
        const floatUp=c===BUBBLE?0.9:1;
        if(Math.random()<floatUp){
          if(get(x,y-1)===EMPTY){set(x,y-1,c);set(x,y,EMPTY);upd[ix(x,y-1)]=1;}
          else{const d=rnd();
            if(get(x+d,y-1)===EMPTY){set(x+d,y-1,c);set(x,y,EMPTY);upd[ix(x+d,y-1)]=1;}
            else if(get(x-d,y-1)===EMPTY){set(x-d,y-1,c);set(x,y,EMPTY);upd[ix(x-d,y-1)]=1;}
            else if(get(x+d,y)===EMPTY){set(x+d,y,c);set(x,y,EMPTY);upd[ix(x+d,y)]=1;}
            else if(windOn&&get(x+1,y)===EMPTY){set(x+1,y,c);set(x,y,EMPTY);upd[ix(x+1,y)]=1;}
          }
        }
        if(c===SMOKE&&Math.random()<0.004)set(x,y,EMPTY);
        if(c===STEAM&&Math.random()<0.002)set(x,y,WATER);
        if(c===BUBBLE&&get(x,y-1)===STONE)set(x,y,EMPTY);
        if(c===BUBBLE&&y===0)set(x,y,EMPTY);
      } else if(c===LAVA){
        if(Math.random()<0.5){
          const below3=get(x,y+1);
          if(below3===EMPTY){set(x,y+1,LAVA);set(x,y,EMPTY);upd[ix(x,y+1)]=1;}
          else{const d=rnd();if(get(x+d,y)===EMPTY){set(x+d,y,LAVA);set(x,y,EMPTY);upd[ix(x+d,y)]=1;}}
        }
        const adj=[[-1,0],[1,0],[0,-1],[0,1]];
        adj.forEach(([dx,dy])=>{
          const nc=get(x+dx,y+dy);
          if(nc===WATER){set(x+dx,y+dy,STEAM);if(Math.random()<0.3)set(x,y,STONE);}
          if(nc===WOOD&&Math.random()<0.01)set(x+dx,y+dy,FIRE);
          if(nc===ICE)set(x+dx,y+dy,WATER);
          if(nc===WATER&&Math.random()<0.05)set(x,y,OBSIDIAN);
        });
        if(Math.random()<0.001)set(x,y,STONE);
      } else if(c===ICE){
        const adj=[[-1,0],[1,0],[0,-1],[0,1]];
        adj.forEach(([dx,dy])=>{
          const nc=get(x+dx,y+dy);
          if(nc===FIRE||nc===LAVA)set(x,y,WATER);
          if(nc===ACID&&Math.random()<0.05)set(x,y,WATER);
          if(nc===WATER&&Math.random()<0.0005)set(x+dx,y+dy,ICE);
        });
      } else if(c===ACID){
        if(Math.random()<0.7){
          const below4=get(x,y+1);
          if(below4===EMPTY||below4===WATER){set(x,y+1,ACID);set(x,y,below4);upd[ix(x,y+1)]=1;}
          else{const d=rnd();if(get(x+d,y)===EMPTY){set(x+d,y,ACID);set(x,y,EMPTY);upd[ix(x+d,y)]=1;}}
        }
        const adj=[[-1,0],[1,0],[0,-1],[0,1]];
        adj.forEach(([dx,dy])=>{
          const nc=get(x+dx,y+dy);
          if([STONE,DIRT,WOOD,SAND,MUD,GLASS,WAX,CORAL].includes(nc)&&Math.random()<0.03){set(x+dx,y+dy,EMPTY);if(Math.random()<0.3)set(x,y,EMPTY);}
          if(nc===LAVA&&Math.random()<0.05){set(x,y,SMOKE);set(x+dx,y+dy,STONE);}
          if(nc===VOID)set(x,y,EMPTY);
        });
      } else if(c===PLANT){
        const adj=[[-1,0],[1,0],[0,-1],[0,1]];
        adj.forEach(([dx,dy])=>{
          const nc=get(x+dx,y+dy);
          if(nc===WATER&&Math.random()<0.002)set(x+dx,y+dy,PLANT);
          if(nc===DIRT&&Math.random()<0.001)set(x+dx,y+dy,PLANT);
          if(nc===SPORE&&Math.random()<0.003)set(x+dx,y+dy,PLANT);
        });
      } else if(c===TORNADO){
        const adj=[[-3,-2],[-2,-2],[-1,-2],[0,-2],[1,-2],[2,-2],[3,-2],[-3,-1],[3,-1],[-3,0],[3,0],[-2,1],[2,1]];
        adj.forEach(([dx,dy])=>{
          const nc=get(x+dx,y+dy);
          if(nc&&nc!==TORNADO&&nc!==STONE&&nc!==OBSIDIAN&&Math.random()<0.06){
            set(x+dx,y+dy,EMPTY);
            const tx=x+Math.floor((Math.random()-.5)*8);
            const ty=y-Math.floor(Math.random()*6)-1;
            if(inB(tx,ty)&&!get(tx,ty))set(tx,ty,nc);
          }
        });
        const d4=rnd();
        if(get(x+d4,y)===EMPTY){set(x+d4,y,TORNADO);set(x,y,EMPTY);upd[ix(x+d4,y)]=1;}
        else if(get(x,y+1)===EMPTY){set(x,y+1,TORNADO);set(x,y,EMPTY);upd[ix(x,y+1)]=1;}
      } else if(c===VIRUS){
        const adj=[[-1,0],[1,0],[0,-1],[0,1]];
        adj.forEach(([dx,dy])=>{
          const nc=get(x+dx,y+dy);
          if(nc&&nc!==VIRUS&&nc!==STONE&&nc!==FIRE&&nc!==LAVA&&nc!==VOID&&nc!==OBSIDIAN&&Math.random()<0.008)set(x+dx,y+dy,VIRUS);
        });
        if(Math.random()<0.004)set(x,y,EMPTY);
        const d5=rnd();
        if(get(x+d5,y+1)===EMPTY){set(x+d5,y+1,VIRUS);set(x,y,EMPTY);upd[ix(x+d5,y+1)]=1;}
        else if(get(x,y+1)===EMPTY){set(x,y+1,VIRUS);set(x,y,EMPTY);upd[ix(x,y+1)]=1;}
      } else if(c===CLOUD){
        if(Math.random()<0.3){
          const d6=rnd();
          if(get(x+d6,y)===EMPTY){set(x+d6,y,CLOUD);set(x,y,EMPTY);upd[ix(x+d6,y)]=1;}
        }
        if(Math.random()<0.005&&get(x,y+1)===EMPTY)set(x,y+1,WATER);
        if(windOn&&get(x+1,y)===EMPTY&&Math.random()<0.5){set(x+1,y,CLOUD);set(x,y,EMPTY);upd[ix(x+1,y)]=1;}
      } else if(c===LIGHTNING){
        const d7=rnd();
        const dirs=[[0,1],[d7,1],[-d7,1],[1,0],[-1,0]];
        let moved=false;
        for(const[dx,dy]of dirs){
          const nc=get(x+dx,y+dy);
          if(nc===EMPTY||nc===WATER||nc===CLOUD){
            if(nc===WATER)set(x+dx,y+dy,STEAM);
            else{set(x+dx,y+dy,LIGHTNING);upd[ix(x+dx,y+dy)]=1;}
            set(x,y,EMPTY);moved=true;break;
          }
          if(nc===STONE||nc===WOOD||nc===PLANT||nc===SAND){set(x+dx,y+dy,FIRE);set(x,y,EMPTY);moved=true;break;}
        }
        if(!moved)set(x,y,EMPTY);
      } else if(c===WAX){
        const adj=[[-1,0],[1,0],[0,-1],[0,1]];
        adj.forEach(([dx,dy])=>{
          if((get(x+dx,y+dy)===FIRE||get(x+dx,y+dy)===LAVA)&&Math.random()<0.005)set(x,y,OIL);
        });
      } else if(c===CORAL){
        const adj=[[-1,0],[1,0],[0,-1],[0,1]];
        adj.forEach(([dx,dy])=>{
          const nc=get(x+dx,y+dy);
          if(nc===WATER&&Math.random()<0.0005)set(x+dx,y+dy,CORAL);
          if(nc===ACID&&Math.random()<0.05)set(x,y,EMPTY);
        });
      } else if(c===SPORE){
        const below5=get(x,y+1);
        if(below5===EMPTY||below5===WATER){set(x,y+1,SPORE);set(x,y,below5);upd[ix(x,y+1)]=1;}
        else{const d8=rnd();if(get(x+d8,y+1)===EMPTY){set(x+d8,y+1,SPORE);set(x,y,EMPTY);upd[ix(x+d8,y+1)]=1;}}
        const adj=[[-1,0],[1,0],[0,-1],[0,1]];
        adj.forEach(([dx,dy])=>{
          if(get(x+dx,y+dy)===PLANT&&Math.random()<0.002)set(x+dx,y+dy,SPORE);
          if(get(x+dx,y+dy)===DIRT&&Math.random()<0.001)set(x+dx,y+dy,PLANT);
        });
        if(Math.random()<0.003)set(x,y,PLANT);
      } else if(c===VOID){
        const adj=[[-1,0],[1,0],[0,-1],[0,1]];
        adj.forEach(([dx,dy])=>{
          const nc=get(x+dx,y+dy);
          if(nc&&nc!==VOID&&nc!==STONE&&Math.random()<0.15)set(x+dx,y+dy,EMPTY);
        });
      } else if(c===MAGNET){
        const range=4;
        for(let dy2=-range;dy2<=range;dy2++){for(let dx2=-range;dx2<=range;dx2++){
          if(!dx2&&!dy2)continue;
          const nc=get(x+dx2,y+dy2);
          if([SAND,DIRT,STONE,GUN].includes(nc)&&Math.random()<0.02){
            const tx2=x+dx2+(dx2<0?1:-1);
            const ty2=y+dy2+(dy2<0?1:-1);
            if(inB(tx2,ty2)&&!get(tx2,ty2)){set(tx2,ty2,nc);set(x+dx2,y+dy2,EMPTY);}
          }
        }}
      }
    }
  }
}

let imgData=ctx.createImageData(W*SCALE,H*SCALE);
let pix=imgData.data;
function render(){
  const bc=bgColor.cv;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const c=grid[ix(x,y)];
      let r,g,b;
      if(!c){r=bc[0];g=bc[1];b=bc[2];}
      else{
        const col=COLS[c];
        const j=(Math.random()-.5)*10;
        r=Math.min(255,Math.max(0,col[0]+j));
        g=Math.min(255,Math.max(0,col[1]+j));
        b=Math.min(255,Math.max(0,col[2]+j));
        if(c===FIRE||c===LAVA){g=Math.max(0,g-Math.random()*50);}
        if(c===LIGHTNING){r=255;g=255;b=Math.floor(Math.random()*100);}
        if(c===TORNADO){r=Math.min(255,r+Math.random()*25);b=Math.min(255,b+Math.random()*25);}
        if(c===ACID){g=Math.min(255,g+Math.random()*30);}
        if(c===VOID){r=Math.floor(Math.random()*20);g=0;b=Math.floor(Math.random()*30);}
        if(c===WATER&&life[ix(x,y)]>0){b=Math.min(255,b+40);r=Math.max(0,r-20);}
      }
      for(let sy=0;sy<SCALE;sy++)for(let sx=0;sx<SCALE;sx++){
        const pi=((y*SCALE+sy)*W*SCALE+(x*SCALE+sx))*4;
        pix[pi]=r;pix[pi+1]=g;pix[pi+2]=b;pix[pi+3]=255;
      }
    }
  }
  ctx.putImageData(imgData,0,0);
}

let lastT=performance.now(),frames=0;
function loop(){
  step();render();
  frames++;
  const now=performance.now();
  if(now-lastT>700){
    document.getElementById('fps').textContent=Math.round(frames*1000/(now-lastT))+' fps';
    frames=0;lastT=now;
  }
  requestAnimationFrame(loop);
}
loop();
</script>
