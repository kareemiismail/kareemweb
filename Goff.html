<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Bullet Dodger: Full 3D</title>
<style>
  body { margin:0; overflow:hidden; background:#111; font-family:Arial,sans-serif; }
  #ui { position:absolute; top:10px; left:10px; color:#fff; z-index:10; }
  #score { font-size:24px; }
  #gameOver { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
              color:red; font-size:48px; display:none; }
  #startScreen { position:absolute; top:0; left:0; width:100%; height:100%; 
                 background: rgba(0,0,0,0.9); color:#fff; display:flex; flex-direction:column;
                 justify-content:center; align-items:center; font-family: Arial,sans-serif; }
  #startScreen input { padding:8px; font-size:20px; margin-bottom:10px; }
  #startScreen button { padding:8px 16px; font-size:20px; cursor:pointer; }
</style>
</head>
<body>

<div id="startScreen">
  <h1>Bullet Dodger Remastered</h1>
  <input type="text" id="playerNameInput" placeholder="Enter your name">
  <button id="startButton">Start Game</button>
</div>

<div id="ui"><div id="score">Score: 0</div></div>
<div id="gameOver">game over u suck</div>
<button id="restartButton" style="
    position:absolute; top:60%; left:50%; transform:translate(-50%, -50%);
    padding: 12px 24px; font-size:24px; display:none; cursor:pointer; z-index:10;
">Restart Game</button>

  
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>

// === Global Variables ===
let scene, camera, renderer;
let player, playerSpeed=0.7, jumpSpeed=0.5, gravity=0.02;
let playerVelocityY=0, onGround=true;
let bullets=[], bulletSpeed=0.4, frameCount=0;
let powerUps=[], powerUpActive={shield:false,speed:false};
let score=0, isGameOver=false, playerName="Player";

// UI Elements
const scoreDisplay = document.getElementById('score');
const gameOverDisplay = document.getElementById('gameOver');
const startScreen = document.getElementById('startScreen');
const playerNameInput = document.getElementById('playerNameInput');
const startButton = document.getElementById('startButton');

// === Input ===
let moveLeft=false, moveRight=false, moveUp=false, moveDown=false;
startButton.onclick = () => {
    playerName = playerNameInput.value || "Player";
    startScreen.style.display="none";
    init();
    animate();
};
document.addEventListener('keydown', e => {
    if(e.key==='ArrowLeft' || e.key==='a') moveLeft=true;
    if(e.key==='ArrowRight' || e.key==='d') moveRight=true;
    if(e.key==='ArrowUp' || e.key==='w') moveUp=true;
    if(e.key==='ArrowDown' || e.key==='s') moveDown=true;
});
document.addEventListener('keyup', e => {
    if(e.key==='ArrowLeft' || e.key==='a') moveLeft=false;
    if(e.key==='ArrowRight' || e.key==='d') moveRight=false;
    if(e.key==='ArrowUp' || e.key==='w') moveUp=false;
    if(e.key==='ArrowDown' || e.key==='s') moveDown=false;
});

// === Init Scene ===
function init(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
    camera.position.z = 40;
    camera.position.y = 10;

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff,1);
    light.position.set(0,50,50);
    scene.add(light);

    // Player
    const playerGeometry = new THREE.BoxGeometry(3,3,3);
    const playerMaterial = new THREE.MeshPhongMaterial({color:0x00ff00});
    player = new THREE.Mesh(playerGeometry,playerMaterial);
    player.position.y=0;
    player.position.x=0;
    player.position.z=0;
    scene.add(player);
}

// === Bullet Creation ===
function spawnBullet(){
    const bulletGeometry = new THREE.SphereGeometry(1,16,16);
    const bulletMaterial = new THREE.MeshPhongMaterial({color:0xff0000});
    const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);

    // Spawn from random face
    const side = Math.floor(Math.random()*6);
    switch(side){
        case 0: bullet.position.x = Math.random()*60-30; bullet.position.y = 30; bullet.position.z = Math.random()*60-30; break; // top
        case 1: bullet.position.x = Math.random()*60-30; bullet.position.y = -10; bullet.position.z = Math.random()*60-30; break; // bottom
        case 2: bullet.position.x = -30; bullet.position.y = Math.random()*20; bullet.position.z = Math.random()*60-30; break; // left
        case 3: bullet.position.x = 30; bullet.position.y = Math.random()*20; bullet.position.z = Math.random()*60-30; break; // right
        case 4: bullet.position.x = Math.random()*60-30; bullet.position.y = Math.random()*20; bullet.position.z = -30; break; // front
        case 5: bullet.position.x = Math.random()*60-30; bullet.position.y = Math.random()*20; bullet.position.z = 30; break; // back
    }

    // Velocity toward player
    const dir = new THREE.Vector3().subVectors(player.position, bullet.position).normalize();
    bullet.userData.velocity = dir.multiplyScalar(bulletSpeed);
    scene.add(bullet);
    bullets.push(bullet);
}

// === Power-up ===
function spawnPowerUp(){
    const types=["shield","speed"];
    const type = types[Math.floor(Math.random()*types.length)];
    const geo = new THREE.TetrahedronGeometry(1.5);
    const mat = new THREE.MeshPhongMaterial({color:type==="shield"?0x00ffff:0xff00ff});
    const power = new THREE.Mesh(geo,mat);
    power.position.x = Math.random()*20-10;
    power.position.y = 20;
    power.position.z = Math.random()*20-10;
    power.userData.type = type;
    scene.add(power);
    powerUps.push(power);
}

// === Update ===
function updatePlayer(){
    if(moveLeft) player.position.x -= playerSpeed*(powerUpActive.speed?2:1);
    if(moveRight) player.position.x += playerSpeed*(powerUpActive.speed?2:1);

    if(moveUp && onGround){ playerVelocityY = jumpSpeed; onGround=false; }
    player.position.y += playerVelocityY;
    if(!onGround) playerVelocityY -= gravity;

    if(player.position.y<=0){ player.position.y=0; playerVelocityY=0; onGround=true; }

    // Bounds
    if(player.position.x<-30) player.position.x=-30;
    if(player.position.x>30) player.position.x=30;
    if(player.position.z<-30) player.position.z=-30;
    if(player.position.z>30) player.position.z=30;
}

function updateBullets(){
    bullets.forEach((b,i)=>{
        b.position.add(b.userData.velocity);

        const distance = b.position.distanceTo(player.position);
        if(!powerUpActive.shield && distance<2.5){ isGameOver=true; }

        if(Math.abs(b.position.x)>40 || b.position.y>40 || b.position.y<-10 || Math.abs(b.position.z)>40){
            scene.remove(b);
            bullets.splice(i,1);
            score++;
        }
    });
}

function updatePowerUps(){
    powerUps.forEach((p,i)=>{
        p.position.y -= 0.2;
        const distance = p.position.distanceTo(player.position);
        if(distance<2.5){
            powerUpActive[p.userData.type]=true;
            setTimeout(()=>powerUpActive[p.userData.type]=false,5000);
            scene.remove(p);
            powerUps.splice(i,1);
        }
        if(p.position.y<-10){
            scene.remove(p);
            powerUps.splice(i,1);
        }
    });
}

// === Animate ===
function animate(){
if(isGameOver){ 
    gameOverDisplay.style.display="block"; 
    restartButton.style.display="block";
    return; 
}
    requestAnimationFrame(animate);

    frameCount++;
    if(frameCount%30===0) spawnBullet(); // spawn faster
    if(frameCount%600===0) spawnPowerUp(); // every 10 sec

    updatePlayer();
    updateBullets();
    updatePowerUps();

    scoreDisplay.textContent=`${playerName}: Score ${score}`;
    renderer.render(scene,camera);
}

window.addEventListener('resize', ()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
function restartGame(){
    // Remove all bullets
    bullets.forEach(b => scene.remove(b));
    bullets = [];
    // Remove all power-ups
    powerUps.forEach(p => scene.remove(p));
    powerUps = [];
    // Reset player
    player.position.set(0,0,0);
    playerVelocityY = 0;
    onGround = true;
    // Reset score
    score = 0;
    frameCount = 0;
    isGameOver = false;
    // Hide UI
    gameOverDisplay.style.display = "none";
    restartButton.style.display = "none";
    // Restart animation
    animate();
}

  const restartButton = document.getElementById('restartButton');
restartButton.onclick = () => restartGame();
</script>
</body>
</html>
