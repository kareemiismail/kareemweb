*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Orbitron',sans-serif;
  background:url('cloud.jpg') center/cover fixed;
  color:#00f7ff;
  overflow-x:hidden;
}

/* ===== CHAOS ===== */
@keyframes megaShake{
  0%{transform:translate(0,0) rotate(0)}
  10%{transform:translate(-15px,10px) rotate(-3deg)}
  20%{transform:translate(15px,-10px) rotate(3deg)}
  30%{transform:translate(-20px,15px) rotate(-4deg)}
  40%{transform:translate(20px,-15px) rotate(4deg)}
  50%{transform:translate(-25px,20px) rotate(-5deg)}
  60%{transform:translate(25px,-20px) rotate(5deg)}
  70%{transform:translate(-20px,15px) rotate(-4deg)}
  80%{transform:translate(20px,-15px) rotate(4deg)}
  90%{transform:translate(-10px,8px) rotate(-2deg)}
  100%{transform:translate(0,0) rotate(0)}
}
.chaos{animation:megaShake .07s infinite}

.flash{
  position:fixed;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
  z-index:9999;
}

header{text-align:center;padding:24px}
header img{
  width:260px;
  border-radius:16px;
  box-shadow:0 0 30px #00eaff;
}
header h1{
  color:white;
  text-shadow:0 0 15px #00eaff,0 0 25px #ff00ff;
}

.app{padding:20px}
.main{display:flex;gap:20px}

#search{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:none;
  font-family:'Orbitron';
  margin-bottom:12px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:12px;
}

.game{
  padding:12px;
  border-radius:14px;
  background:linear-gradient(145deg,#00aaff,#ff00ff);
  color:white;
  font-weight:bold;
  text-align:center;
  text-decoration:none;
  box-shadow:0 0 14px #00eaff;
  transition:.2s;
}
.game:hover{transform:scale(1.07)}

.side{
  width:360px;
  padding:16px;
  background:rgba(0,0,0,.6);
  border-radius:16px;
  border:1px solid #00eaff;
}

input,textarea,button{
  width:100%;
  margin-top:6px;
  padding:8px;
  border-radius:10px;
  border:none;
  font-family:'Orbitron';
}
button{cursor:pointer;font-weight:bold}

.comment{
  background:rgba(0,0,0,.7);
  border:1px solid #00eaff;
  padding:8px;
  border-radius:10px;
  margin-top:8px;
}

footer{
  margin-top:30px;
  padding:14px;
  text-align:center;
  background:rgba(0,0,0,.6);
  border-top:1px solid #00eaff;
}

<body>

<div id="flash" class="flash"></div>

<div id="app" class="app">

<header>
<img src="Kareemweb.png">
<h1>KareemWeb ッ</h1>
</header>

<div class="main">

<div style="flex:1">
<input id="search" placeholder="🔍 Search games">
<div id="games" class="gallery"></div>
</div>

<div class="side">
<h3>🎵 Music</h3>
<button onclick="toggleMusic()">Toggle Music</button>
<marquee direction="right" scrollamount="100">help meeeeeeeeeeeeee</marquee>
<h3>🌪 Chaos Mode</h3>
<button onclick="toggleChaos()">CHAOS MODE</button>

<h3>💬 Comments</h3>
<form id="commentForm">
<input id="name" placeholder="Name" required>
<textarea id="comment" placeholder="Comment..." required></textarea>
<button>Post</button>
</form>
<div id="commentsList"></div>
</div>

</div>

<footer>© 2025 KareemWeb</footer>
</div>

<audio id="bgMusic" src="Kevin MacLeod - Airport Lounge.mp3" loop></audio>
<audio id="chaosMusic" src="Spazzmatica Polka.mp3"></audio>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ===== DOM ===== */
const games = document.getElementById("games");
const search = document.getElementById("search");
const app = document.getElementById("app");
const flash = document.getElementById("flash");
const chaosMusic = document.getElementById("chaosMusic");

/* ===== GAMES ===== */
const gamesData=[
["About Me","about me.html"],
["Music Player","MusicPlayer.html"],
["Vidtube","vidtube.html"],
["Bullet Dodger 1","Bullet Dodger 1.html"],
["2dPlat","2dPlat.html"],
["Algonquin Apples","algonquin_apples.html"],
["Minecraft","minecraft.html"],
["NetKareem","netkareem.html"],
["Solar Sandbox","solar.html"],
["Sandbox","the thing.html"],
["Tsunami Survival","Tsunami Survival!.html"],
["City Simulator","citysim.html"],
["Banana World","banana.html"],
["Posters","Posters.html"],
["Tablet Download","downloadtablet.html"],
["Tablet","tablet_interface.html"],
["Eaglercraft","Eaglercraft.html"],
["Watch Paint Dry","watch_paint_dry.html"],
["RPG","hi.html"],
["Jump Over Cars","Jump Over Cars.html"],
["Fireworks","Fireworks Show.html"],
["Corn","Corn.html"],
["Bullet Dodger Remastered","Goff.html"],
["Minesweeper","minesweeper.html"],
["Music Lab","kareem music lab.html"],
["Feer","Feer.zip"],
["Password Generator (NEW!)","password generator.html"],
["TypeNet(NEW!)","https://www.mediafire.com/file/37u4ndas01opfsr/typenet.exe/file"],
["YouTube","https://www.youtube.com/@karemeon"],
];

function render(){
  games.innerHTML="";
  const q = search.value.toLowerCase();
  gamesData.forEach(([name,link])=>{
    if(!name.toLowerCase().includes(q)) return;
    const a=document.createElement("a");
    a.href=link;
    a.target="_blank";
    a.className="game";
    a.textContent=name;
    games.appendChild(a);
  });
}
search.addEventListener("input",render);
render();

/* ===== MUSIC ===== */
const bg=document.getElementById("bgMusic");
function toggleMusic(){bg.paused?bg.play():bg.pause()}

/* ===== CHAOS ===== */
let chaos=false,flashInt=null;
function toggleChaos(){
  chaos=!chaos;
  app.classList.toggle("chaos",chaos);
  if(chaos){
    chaosMusic.play();
    flashInt=setInterval(()=>{
      flash.style.opacity=Math.random()>.5?.9:0;
      flash.style.background=Math.random()>.5?"white":"red";
      setTimeout(()=>flash.style.opacity=0,60);
    },110);
  }else{
    chaosMusic.pause();chaosMusic.currentTime=0;
    clearInterval(flashInt);
    flash.style.opacity=0;
  }
}

/* ===== COMMENTS + REPLIES ===== */
firebase.initializeApp({
  apiKey:"AIzaSyCKlWFT-IEzSS5wLjuDrAX7C8o0XgMDNBA",
  authDomain:"awesome-18f46.firebaseapp.com",
  projectId:"awesome-18f46"
});
const db=firebase.firestore();
const commentsList=document.getElementById("commentsList");

function buildComment(c,indent=0){
  const d=document.createElement("div");
  d.className="comment";
  d.style.marginLeft=indent+"px";
  d.innerHTML=`<b>${c.name}</b><br>${c.comment}<br><button>Reply</button><div></div>`;
  d.querySelector("button").onclick=()=>{
    const n=prompt("Name?");
    const t=prompt("Reply?");
    if(n&&t)db.collection("comments").add({name:n,comment:t,parentId:c.id,time:Date.now()});
  };
  c.children.forEach(r=>d.lastChild.appendChild(buildComment(r,indent+20)));
  return d;
}

db.collection("comments").orderBy("time").onSnapshot(s=>{
  commentsList.innerHTML="";
  const map={};
  s.forEach(d=>map[d.id]={id:d.id,...d.data(),children:[]});
  Object.values(map).forEach(c=>c.parentId&&map[c.parentId]?.children.push(c));
  Object.values(map).filter(c=>!c.parentId).forEach(c=>commentsList.appendChild(buildComment(c)));
});

commentForm.onsubmit=e=>{
  e.preventDefault();
  db.collection("comments").add({
    name:name.value,
    comment:comment.value,
    parentId:null,
    time:Date.now()
  });
  commentForm.reset();
};
</script>
  <div class="canada-sides">
  <div class="canada-side left"></div>
  <div class="canada-side right"></div>
</div>
</body>
