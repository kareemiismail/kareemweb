<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KareemMusic Lab</title>
<link rel="icon" href="kareemmusiclab.png">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
    margin:0;
    background:radial-gradient(#111,#000);
    color:white;
    font-family:Arial;
    text-align:center;
}
#logo{
    height:70px;
    margin:10px;
    filter:drop-shadow(0 0 10px cyan);
}
.controls{margin:8px;}
button,input{
    padding:6px 10px;
    font-size:14px;
    border-radius:8px;
    border:none;
    margin:3px;
}
button{
    background:#00ffee;
    box-shadow:0 0 10px #00ffee;
    cursor:pointer;
}
canvas{
    background:linear-gradient(#222,#111);
    border-radius:12px;
    box-shadow:0 0 20px #00ffee55;
    margin-top:10px;
}
.panel{
    width:90%;
    max-width:900px;
    background:#111;
    border-radius:12px;
    box-shadow:0 0 15px #00ffee55;
    padding:10px;
    margin:10px auto;
}
#messages,#songs{
    max-height:180px;
    overflow-y:auto;
    background:#000;
    padding:6px;
    border-radius:8px;
}
.msg{margin:3px 0;}
a{color:#00ffee}
.drumBtn{
    background:#ff8844;
    box-shadow:0 0 10px #ff8844;
}
</style>
</head>

<body>

<img id="logo" src="kareemmusiclab.png">

<!-- CONTROLS -->
<div class="controls">
<button onclick="togglePlay()">▶ Play / ⏹ Stop</button>
<button onclick="saveSong()">💾 Save</button>
<button onclick="loadSong()">📂 Load</button>
<button onclick="shareSong()">🌐 Share</button>
<input type="color" id="colorPicker" value="#00ffee">
</div>

<div class="controls">
Cols ➡️ <input type="range" min="8" max="64" value="32" oninput="resizeGrid(this.value, rows)">
Rows ⬇️ <input type="range" min="12" max="24" value="16" oninput="resizeGrid(cols, this.value)">
</div>

<canvas id="grid" width="960" height="420"></canvas>

<div class="controls">
<button class="drumBtn" onclick="playDrum(0)">Z Kick</button>
<button class="drumBtn" onclick="playDrum(1)">X Snare</button>
<button class="drumBtn" onclick="playDrum(2)">C Hi-Hat</button>
<button class="drumBtn" onclick="playDrum(3)">V Clap</button>
</div>

<!-- SONG SHARING -->
<div class="panel">
<h3>🌐 Shared Songs</h3>
<input id="songTitle" placeholder="Song name">
<div id="songs"></div>
</div>

<!-- CHAT -->
<div class="panel">
<h3>💬 Live Chat</h3>
<input id="chatName" placeholder="Name">
<input id="chatMsg" placeholder="Message">
<button onclick="sendChat()">Send</button>
<div id="messages"></div>
</div>

<script>
/* ================= MUSIC GRID ================= */

const canvas = document.getElementById("grid");
const ctx = canvas.getContext("2d");

let cols=32, rows=16;
const pianoRows=12;
const notes=[523,494,466,440,392,349,330,294,262,220,196,174];
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();

function makeGrid(c,r,old=[]){
    return Array.from({length:r},(_,y)=>
        Array.from({length:c},(_,x)=>old[y]?.[x]||null)
    );
}
let grid = makeGrid(cols,rows);

let cellW,cellH;
function updateCellSize(){
    cellW=canvas.width/cols;
    cellH=canvas.height/rows;
}

let mouseDown=false,startCol=0,startRow=0;
canvas.oncontextmenu=e=>e.preventDefault();

canvas.onmousedown=e=>{
    const r=canvas.getBoundingClientRect();
    const col=Math.floor((e.clientX-r.left)/cellW);
    const row=Math.floor((e.clientY-r.top)/cellH);
    if(e.button===2){ grid[row][col]=null; draw(); return; }
    mouseDown=true;
    startCol=col; startRow=row;
    grid[row][col]=colorPicker.value;
    draw();
};
canvas.onmousemove=e=>{
    if(!mouseDown) return;
    const r=canvas.getBoundingClientRect();
    const col=Math.floor((e.clientX-r.left)/cellW);
    const from=Math.min(startCol,col);
    const to=Math.max(startCol,col);
    for(let c=from;c<=to;c++) grid[startRow][c]=colorPicker.value;
    draw();
};
canvas.onmouseup=()=>mouseDown=false;

function draw(){
    updateCellSize();
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let y=0;y<rows;y++){
        for(let x=0;x<cols;x++){
            ctx.strokeStyle="#333";
            ctx.strokeRect(x*cellW,y*cellH,cellW,cellH);
            if(grid[y][x]){
                ctx.fillStyle=y>=pianoRows?"#ff8844":grid[y][x];
                ctx.fillRect(x*cellW+2,y*cellH+2,cellW-4,cellH-4);
            }
        }
    }
}
draw();

/* ================= PLAYBACK ================= */

let playing=false,step=0;
function playSound(row,len){
    if(row<pianoRows){
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type="triangle";
        o.frequency.value=notes[row];
        g.gain.value=0.3;
        o.connect(g).connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime+len);
    }else playDrum(row-pianoRows);
}

function loop(){
    if(!playing) return;
    const stepTime=0.2;
    for(let r=0;r<rows;r++){
        if(grid[r][step]){
            let len=1;
            while(step+len<cols && grid[r][step+len]) len++;
            playSound(r,stepTime*len);
        }
    }
    step=(step+1)%cols;
    setTimeout(loop,stepTime*1000);
}

function togglePlay(){
    playing=!playing;
    if(playing){step=0;loop();}
}

/* ================= DRUMS ================= */

function playDrum(t){
    const g=audioCtx.createGain();
    g.connect(audioCtx.destination);
    const o=audioCtx.createOscillator();
    o.frequency.value= t===0?120:t===1?220:t===2?600:180;
    g.gain.value=0.4;
    o.connect(g); o.start(); o.stop(audioCtx.currentTime+0.15);
}

document.addEventListener("keydown",e=>{
    if(e.key==="z")playDrum(0);
    if(e.key==="x")playDrum(1);
    if(e.key==="c")playDrum(2);
    if(e.key==="v")playDrum(3);
});

/* ================= SAVE / LOAD ================= */

function saveSong(){
    localStorage.setItem("kml_song",JSON.stringify({cols,rows,grid}));
    alert("Saved!");
}
function loadSong(){
    const d=JSON.parse(localStorage.getItem("kml_song"));
    if(!d) return;
    cols=d.cols; rows=d.rows; grid=d.grid;
    draw();
}

/* ================= URL ENCODE ================= */

function encodeSongToURL(){
    const data=btoa(JSON.stringify({cols,rows,grid}));
    return location.origin+location.pathname+"?song="+data;
}

/* ================= FIREBASE ================= */

firebase.initializeApp({
  apiKey:"AIzaSyCjML67utFmOHZk3T5HZL5NlIR9YFd_5lU",
  authDomain:"kareemmusiclab.firebaseapp.com",
  databaseURL:"https://kareemmusiclab-default-rtdb.firebaseio.com"
});
const db=firebase.database();

/* ================= SHARE SONG ================= */

function shareSong(){
    const title=songTitle.value||"Untitled Song";
    const link=encodeSongToURL();
    navigator.clipboard.writeText(link);
    db.ref("songs").push({title,link,time:Date.now()});
    alert("Song shared!");
    songTitle.value="";
}

db.ref("songs").limitToLast(50).on("child_added",s=>{
    const d=s.val();
    const a=document.createElement("a");
    a.href=d.link;
    a.textContent="🎵 "+d.title;
    a.target="_blank";
    songs.appendChild(a);
    songs.appendChild(document.createElement("br"));
});

/* ================= CHAT ================= */

function sendChat(){
    if(!chatMsg.value) return;
    db.ref("chat").push({
        name:chatName.value||"Anon",
        text:chatMsg.value,
        time:Date.now()
    });
    chatMsg.value="";
}

db.ref("chat").limitToLast(50).on("child_added",s=>{
    const m=s.val();
    const div=document.createElement("div");
    div.className="msg";
    div.textContent=m.name+": "+m.text;
    messages.appendChild(div);
    messages.scrollTop=messages.scrollHeight;
});

/* ================= AUTO LOAD FROM URL ================= */

const p=new URLSearchParams(location.search);
if(p.has("song")){
    try{
        const d=JSON.parse(atob(p.get("song")));
        cols=d.cols; rows=d.rows; grid=d.grid;
        draw();
    }catch{}
}
</script>

</body>
</html>
