<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Jump Over Cars!</title>
  <style>
    body {
      margin: 0;
      background: #87ceeb;
      overflow: hidden;
      font-family: sans-serif;
    }
    #game {
      position: relative;
      width: 800px;
      height: 300px;
      margin: 20px auto;
      background: #eee;
      border: 3px solid #333;
      overflow: hidden;
    }
    #player {
      position: absolute;
      width: 40px;
      height: 40px;
      background: green;
      bottom: 50px; /* Start on ground */
      left: 50px;
    }
    .car {
      position: absolute;
      bottom: 50px;
      width: 80px;
      height: 40px;
      background: red;
      border-radius: 5px;
      box-shadow: 0 0 0 3px #222 inset;
    }
    .car::before, .car::after {
      content: "";
      position: absolute;
      bottom: -10px;
      width: 20px;
      height: 20px;
      background: black;
      border-radius: 50%;
    }
    .car::before { left: 10px; }
    .car::after { right: 10px; }
    .window {
  position: absolute;
  top: -20px;  /* raise the window up */
  left: 15px; /* shift slightly for balance */
  width: 35px;
  height: 30px;
  background: #add8e6;
  border: 2px solid #333;
}
    .headlight {
      position: absolute;
      top: 0px;
      right: 70px;
      width: 10px;
      height: 10px;
      background: yellow;
      border-radius: 50%;
    }
    #ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: #444;
    }
    #score {
      text-align: center;
      font-size: 24px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="player"></div>
    <div id="ground"></div>
  </div>
  <div id="score">Score: 0</div>

  <script>
    const game = document.getElementById("game");
    const player = document.getElementById("player");
    const scoreDisplay = document.getElementById("score");

    const groundHeight = 50;
    const playerHeight = 40;
    const floorY = groundHeight; // bottom Y of the ground
    let playerY = floorY; // actual vertical pos
    let velocity = 0;
    let gravity = -0.6; // negative = pulling down
    let jumpPower = 15; 
    let jumping = false;

    let score = 0;
    let gameOver = false;
    let cars = [];

    function jump() {
      if (!jumping) {
        jumping = true;
        velocity = jumpPower;
      }
    }

    document.addEventListener("keydown", (e) => {
      if ((e.code === "Space" || e.code === "ArrowUp") && !gameOver) {
        jump();
      }
      if (e.code === "Enter" && gameOver) {
        window.location.reload();
      }
    });

    function spawnCar() {
      if (gameOver) return;
      const car = document.createElement("div");
      car.classList.add("car");
      car.style.left = game.clientWidth + "px";

      // Random car color
      car.style.background = ["red", "blue", "purple", "orange", "yellow", "pink"][Math.floor(Math.random()*6)];

      // Add window + headlight
      const windowEl = document.createElement("div");
      windowEl.classList.add("window");
      car.appendChild(windowEl);

      const headlight = document.createElement("div");
      headlight.classList.add("headlight");
      car.appendChild(headlight);

      game.appendChild(car);
      cars.push(car);
      setTimeout(spawnCar, 1500 + Math.random() * 2000);
    }

    function update() {
      if (gameOver) return;

      // Player physics
      velocity += gravity;
      playerY += velocity;

      if (playerY <= floorY) {
        playerY = floorY;
        velocity = 0;
        jumping = false;
      }

      player.style.bottom = playerY + "px";

      // Cars move
      for (let i = cars.length - 1; i >= 0; i--) {
        let car = cars[i];
        let carX = parseInt(car.style.left);
        carX -= 5;
        if (carX + 80 < 0) {
          car.remove();
          cars.splice(i, 1);
          score++;
          scoreDisplay.innerText = "Score: " + score;
        } else {
          car.style.left = carX + "px";

          // Collision check
          let playerRect = player.getBoundingClientRect();
          let carRect = car.getBoundingClientRect();
          if (
            playerRect.left < carRect.right &&
            playerRect.right > carRect.left &&
            playerRect.top < carRect.bottom &&
            playerRect.bottom > carRect.top
          ) {
            gameOver = true;
            scoreDisplay.innerText = "Game Over! Final Score: " + score + " (Press Enter to Restart)";
          }
        }
      }

      requestAnimationFrame(update);
    }

    spawnCar();
    update();
  </script>
</body>
</html>
