<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG</title>
</head>
<body>

<div id="rpg-box">
  <h3>Mini RPG Full Screen + Boss</h3>
  <p>Use arrow keys to move. Collect 🍎 to heal. Avoid enemies and defeat the boss! 🐉</p>
  <div id="map"></div>
  <p id="stats"></p>
  <p id="enemyCount"></p>
</div>

<style>
body, html { margin:0; padding:0; height:100%; background:#111; color:#0f0; font-family: monospace; overflow:hidden; }
#rpg-box { width:100%; height:100%; box-sizing:border-box; padding:10px; }
#map {
  display: grid;
  width:100%;
  height:calc(100% - 120px);
  gap:1px;
}
.tile { text-align:center; line-height:1; }
.floor { background:#222; }
.wall { background:#555; }
.player { background:#0ff; color:#000; }
.enemy { background:#f00; color:#000; }
.boss { background:#800080; color:#fff; }
.item { background:#ff0; color:#000; }
</style>

<script>
let tileSize = 20;
let player = { x:0, y:0, hp:20, xp:0, level:1, maxHp:20 };
let enemies = [{ x:10, y:8, hp:8 }];
let boss = null;
let items = [{ x:4, y:2 }, { x:7, y:1 }];
let mapSizeX = Math.floor(window.innerWidth / tileSize);
let mapSizeY = Math.floor((window.innerHeight - 120) / tileSize);
let map = [];

function createMap(){
  map=[];
  for(let y=0;y<mapSizeY;y++){
    const row=[];
    for(let x=0;x<mapSizeX;x++){
      row.push('floor');
    }
    map.push(row);
  }
  // random walls
  for(let i=0;i<Math.floor(mapSizeX*mapSizeY*0.1);i++){
    const wx=Math.floor(Math.random()*mapSizeX);
    const wy=Math.floor(Math.random()*mapSizeY);
    if(wx!==0 || wy!==0) map[wy][wx]='wall';
  }
}

function drawMap(){
  const mapDiv = document.getElementById('map');
  mapDiv.style.gridTemplateColumns=`repeat(${mapSizeX},${tileSize}px)`;
  mapDiv.style.gridTemplateRows=`repeat(${mapSizeY},${tileSize}px)`;
  mapDiv.innerHTML='';
  for(let y=0;y<mapSizeY;y++){
    for(let x=0;x<mapSizeX;x++){
      const tile=document.createElement('div');
      tile.className='tile '+map[y][x];
      tile.style.width=tileSize+'px';
      tile.style.height=tileSize+'px';
      if(player.x===x && player.y===y) tile.className='tile player';
      else if(enemies.some(e=>e.x===x && e.y===y)) tile.className='tile enemy';
      else if(boss && boss.x===x && boss.y===y) tile.className='tile boss';
      else if(items.some(it=>it.x===x && it.y===y)) tile.className='tile item';
      mapDiv.appendChild(tile);
    }
  }
  document.getElementById('stats').textContent=`HP: ${player.hp}/${player.maxHp} | XP: ${player.xp} | Level: ${player.level}`;
  let count = enemies.length + (boss?1:0);
  document.getElementById('enemyCount').textContent=`Enemies alive: ${count}`;
}

function movePlayer(dx,dy){
  const nx=player.x+dx;
  const ny=player.y+dy;
  if(nx<0||ny<0||nx>=mapSizeX||ny>=mapSizeY) return;
  if(map[ny][nx]==='wall') return;
  player.x=nx;
  player.y=ny;
  checkTile();
  drawMap();
}

function moveEnemies(){
  enemies.forEach(enemy=>{
    const dirs=[{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}];
    const d=dirs[Math.floor(Math.random()*dirs.length)];
    const nx=enemy.x+d.dx;
    const ny=enemy.y+d.dy;
    if(nx>=0 && ny>=0 && nx<mapSizeX && ny<mapSizeY && map[ny][nx]!=='wall'){
      enemy.x=nx; enemy.y=ny;
    }
  });
  if(boss){
    // Boss moves slowly
    if(Math.random()<0.5){
      const dirs=[{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}];
      const d=dirs[Math.floor(Math.random()*dirs.length)];
      const nx=boss.x+d.dx;
      const ny=boss.y+d.dy;
      if(nx>=0 && ny>=0 && nx<mapSizeX && ny<mapSizeY && map[ny][nx]!=='wall'){
        boss.x=nx; boss.y=ny;
      }
    }
  }
  checkTile();
  drawMap();
}

function checkTile(){
  // Enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(player.x===e.x && player.y===e.y){
      player.hp-=2;
      e.hp-=3;
      if(e.hp<=0){
        enemies.splice(i,1);
        player.xp+=5;
        spawnEnemies(2);
        spawnItems(1);
        alert('Enemy defeated! 2 more appear!');
      }
      if(player.hp<=0) alert('You died! 💀');
    }
  }
  // Boss
  if(boss && player.x===boss.x && player.y===boss.y){
    player.hp-=5;
    boss.hp-=5;
    if(boss.hp<=0){
      player.xp+=50;
      boss=null;
      spawnItems(3);
      alert('Boss defeated! 🌟 Big XP reward!');
    }
    if(player.hp<=0) alert('You died! 💀');
  }
  // Items
  for(let i=items.length-1;i>=0;i--){
    if(items[i].x===player.x && items[i].y===player.y){
      player.hp=Math.min(player.maxHp, player.hp+3);
      items.splice(i,1);
    }
  }
  // Level up
  if(player.xp>=player.level*10){
    player.level++;
    player.maxHp+=5;
    player.hp=player.maxHp;
    alert('Level up! 🌟 Level '+player.level);
    if(player.level>=5 && !boss){
      spawnBoss();
      alert('A boss has appeared! 🐉');
    }
  }
}

function spawnEnemies(count){
  for(let i=0;i<count;i++){
    let x,y;
    do{
      x=Math.floor(Math.random()*mapSizeX);
      y=Math.floor(Math.random()*mapSizeY);
    }while(map[y][x]==='wall' || (x===player.x && y===player.y));
    enemies.push({x,y,hp:5 + Math.floor(Math.random()*3)});
  }
}

function spawnItems(count){
  for(let i=0;i<count;i++){
    let x,y;
    do{
      x=Math.floor(Math.random()*mapSizeX);
      y=Math.floor(Math.random()*mapSizeY);
    }while(map[y][x]==='wall' || items.some(it=>it.x===x && it.y===y));
    items.push({x,y});
  }
}

function spawnBoss(){
  let x,y;
  do{
    x=Math.floor(Math.random()*mapSizeX);
    y=Math.floor(Math.random()*mapSizeY);
  }while(map[y][x]==='wall' || (x===player.x && y===player.y));
  boss={x,y,hp:50};
}

document.addEventListener('keydown',e=>{
  switch(e.key){
    case 'ArrowUp': movePlayer(0,-1); break;
    case 'ArrowDown': movePlayer(0,1); break;
    case 'ArrowLeft': movePlayer(-1,0); break;
    case 'ArrowRight': movePlayer(1,0); break;
  }
});

createMap();
drawMap();
setInterval(moveEnemies,1000);
window.addEventListener('resize',()=>{
  mapSizeX = Math.floor(window.innerWidth / tileSize);
  mapSizeY = Math.floor((window.innerHeight - 120) / tileSize);
  createMap();
  drawMap();
});
</script>
 
</body>
</html>
