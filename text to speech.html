<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text-to-Speech</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #f0f0f0;
    }
    textarea {
      width: 80%;
      height: 100px;
      font-size: 16px;
      padding: 10px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>text to speech box</h1>
  <textarea id="textInput" placeholder="Type something here..."></textarea><br>
  <button onclick="speakText()">Speak</button>

  <script>
    function speakText() {
      const text = document.getElementById('textInput').value;
      if (!text) return alert('Please enter some text!');
      
      const utterance = new SpeechSynthesisUtterance(text);
      // Optional: set voice, rate, pitch
      utterance.rate = 1;   // speed (0.1 - 10)
      utterance.pitch = 1;  // pitch (0 - 2)
      utterance.lang = 'en-US'; // language

      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
